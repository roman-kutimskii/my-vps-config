---
- name: Bootstrap VPS access
  hosts: all
  gather_facts: true
  remote_user: root
  vars:
    ansible_password: "{{ vault_root_ssh_password }}"
    dev_password_hash: >-
      {{ vault_dev_password | password_hash('sha512', 'devsalt') }}

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

  tasks:
    - name: Validate target OS
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version == '24.04'
        fail_msg: This project supports only Ubuntu 24.04 LTS.

    - name: Validate required bootstrap variables
      ansible.builtin.assert:
        that:
          - dev_authorized_key is match('^ssh-')
          - vault_root_ssh_password != 'REPLACE_ME'
          - vault_dev_password != 'REPLACE_ME'
        fail_msg: Fill required bootstrap variables and secrets before running bootstrap.yml.

    - name: Install bootstrap packages
      ansible.builtin.apt:
        name:
          - sudo
        state: present
        update_cache: true

    - name: Create dev user
      ansible.builtin.user:
        name: dev
        password: "{{ dev_password_hash }}"
        update_password: always
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true

    - name: Install authorized key for dev
      ansible.posix.authorized_key:
        user: dev
        state: present
        key: "{{ dev_authorized_key }}"

    - name: Create projects directory
      ansible.builtin.file:
        path: /home/dev/projects
        state: directory
        owner: dev
        group: dev
        mode: '0755'

    - name: Configure SSH bootstrap restrictions
      ansible.builtin.template:
        src: templates/sshd_config.d/99-bootstrap.conf.j2
        dest: /etc/ssh/sshd_config.d/99-bootstrap.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart ssh

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers
