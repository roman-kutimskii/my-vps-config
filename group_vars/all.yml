dev_user: dev
dev_group: dev
dev_home: /home/dev
dev_projects_dir: /home/dev/projects
dev_authorized_key: "ssh-ed25519 REPLACE_ME"

server_timezone: Europe/Moscow
swapfile_path: /swapfile
swapfile_size_mb: 2048

opencode_domain: opencode.example.com
opencode_host: 127.0.0.1
opencode_port: 4096

bootstrap_packages:
  - sudo

base_packages:
  - git
  - curl
  - tmux
  - ufw
  - ca-certificates

docker_apt_keyring: /etc/apt/keyrings/docker.asc
docker_apt_repo: >-
  deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
  https://download.docker.com/linux/ubuntu
  {{ ansible_distribution_release }} stable
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

caddy_packages:
  - caddy
