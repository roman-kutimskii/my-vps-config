dev_user: dev
dev_group: dev
dev_home: /home/dev
dev_projects_dir: /home/dev/projects
dev_authorized_key: "ssh-ed25519 REPLACE_ME"
dev_password_hash_salt: devsudo123456789

server_timezone: Europe/Moscow
swapfile_path: /swapfile
swapfile_size_mb: 2048

opencode_domain: opencode.example.com
opencode_host: 127.0.0.1
opencode_port: 4096
opencode_install_script_url: https://opencode.ai/install
opencode_binary: "{{ dev_home }}/.opencode/bin/opencode"

bootstrap_packages:
  - sudo

base_packages:
  - git
  - curl
  - tmux
  - ufw
  - ca-certificates

docker_apt_keyring: /etc/apt/keyrings/docker.asc
docker_apt_arch_map:
  x86_64: amd64
  aarch64: arm64
docker_apt_repo: >-
  deb [arch={{ docker_apt_arch_map[ansible_architecture] | default(ansible_architecture) }} signed-by=/etc/apt/keyrings/docker.asc]
  https://download.docker.com/linux/ubuntu
  {{ ansible_distribution_release }} stable
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

caddy_packages:
  - caddy
