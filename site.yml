---
- name: Configure VPS base services
  hosts: all
  gather_facts: true
  remote_user: dev
  become: true
  vars:
    ansible_become_password: "{{ vault_dev_password }}"
    authelia_domain: "auth.{{ root_domain }}"
    opencode_domain: "opencode.{{ root_domain }}"
    authelia_url: "https://{{ authelia_domain }}"
    opencode_url: "https://{{ opencode_domain }}"
    authelia_config_dir: "{{ authelia_dir }}/config"
    authelia_data_dir: "{{ authelia_dir }}/data"

  handlers:
    - name: Restart opencode
      ansible.builtin.service:
        name: opencode
        state: restarted

    - name: Restart caddy
      ansible.builtin.service:
        name: caddy
        state: restarted

  pre_tasks:
    - name: Validate target OS
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == 'Ubuntu'
          - ansible_facts["distribution_version"] == '24.04'
        fail_msg: This project supports only Ubuntu 24.04 LTS.

    - name: Validate required site variables
      ansible.builtin.assert:
        that:
          - server_timezone | length > 0
          - swapfile_path | length > 0
          - (swapfile_size_mb | int) > 0
          - root_domain | length > 0
          - authelia_username | length > 0
          - authelia_dir | length > 0
          - vault_dev_password != 'REPLACE_ME'
          - vault_authelia_password_hash != 'REPLACE_ME'
          - vault_authelia_session_secret != 'REPLACE_ME'
          - vault_authelia_storage_encryption_key != 'REPLACE_ME'
          - vault_authelia_redis_password != 'REPLACE_ME'
        fail_msg: Fill required site variables and secrets before running site.yml.

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true

    - name: Set timezone symlink
      ansible.builtin.file:
        src: "/usr/share/zoneinfo/{{ server_timezone }}"
        dest: /etc/localtime
        state: link
        force: true

    - name: Write timezone file
      ansible.builtin.copy:
        dest: /etc/timezone
        content: "{{ server_timezone }}\n"
        owner: root
        group: root
        mode: '0644'

    - name: Check swapfile state
      ansible.builtin.stat:
        path: "{{ swapfile_path }}"
      register: swapfile_stat

    - name: Allocate swapfile
      ansible.builtin.command:
        cmd: "fallocate -l {{ swapfile_size_mb }}M {{ swapfile_path }}"
      when: not swapfile_stat.stat.exists

    - name: Set swapfile permissions
      ansible.builtin.file:
        path: "{{ swapfile_path }}"
        owner: root
        group: root
        mode: '0600'

    - name: Initialize swapfile
      ansible.builtin.command:
        cmd: "mkswap {{ swapfile_path }}"
      when: not swapfile_stat.stat.exists

    - name: Persist swapfile mount
      ansible.posix.mount:
        path: none
        src: "{{ swapfile_path }}"
        fstype: swap
        opts: sw
        state: present

    - name: Check active swap devices
      ansible.builtin.command:
        cmd: swapon --noheadings --show=NAME
      register: active_swap_devices
      changed_when: false

    - name: Enable swapfile
      ansible.builtin.command:
        cmd: "swapon {{ swapfile_path }}"
      when: swapfile_path not in active_swap_devices.stdout_lines

    - name: Set UFW default incoming policy
      ansible.builtin.command:
        cmd: ufw default deny incoming
      register: ufw_incoming
      changed_when: "'Default incoming policy changed' in ufw_incoming.stdout"

    - name: Set UFW default outgoing policy
      ansible.builtin.command:
        cmd: ufw default allow outgoing
      register: ufw_outgoing
      changed_when: "'Default outgoing policy changed' in ufw_outgoing.stdout"

    - name: Allow SSH through UFW
      ansible.builtin.command:
        cmd: ufw allow 22/tcp
      register: ufw_ssh
      changed_when: "'Rule added' in ufw_ssh.stdout or 'updated' in ufw_ssh.stdout"

    - name: Allow HTTP through UFW
      ansible.builtin.command:
        cmd: ufw allow 80/tcp
      register: ufw_http
      changed_when: "'Rule added' in ufw_http.stdout or 'updated' in ufw_http.stdout"

    - name: Allow HTTPS through UFW
      ansible.builtin.command:
        cmd: ufw allow 443/tcp
      register: ufw_https
      changed_when: "'Rule added' in ufw_https.stdout or 'updated' in ufw_https.stdout"

    - name: Enable UFW
      ansible.builtin.command:
        cmd: ufw --force enable
      register: ufw_enable
      changed_when: "'Firewall is active' not in ufw_enable.stdout"

    - name: Create Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install Docker repository key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: '0644'

    - name: Configure Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_facts["distribution_release"] }} stable
        filename: docker
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Add dev user to docker group
      ansible.builtin.user:
        name: dev
        groups: docker
        append: true

    - name: Install OpenCode for dev user
      ansible.builtin.shell: >-
        curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
      args:
        creates: /home/dev/.opencode/bin/opencode
      become_user: dev

    - name: Install OpenCode systemd unit
      ansible.builtin.template:
        src: templates/opencode.service.j2
        dest: /etc/systemd/system/opencode.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart opencode

    - name: Reload systemd manager
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure OpenCode service is enabled
      ansible.builtin.service:
        name: opencode
        enabled: true
        state: started

    - name: Create Authelia directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ authelia_dir }}"
          mode: '0755'
        - path: "{{ authelia_config_dir }}"
          mode: '0750'
        - path: "{{ authelia_data_dir }}"
          mode: '0750'

    - name: Install Authelia compose file
      ansible.builtin.template:
        src: templates/authelia/docker-compose.yml.j2
        dest: "{{ authelia_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0640'

    - name: Install Authelia configuration
      ansible.builtin.template:
        src: templates/authelia/configuration.yml.j2
        dest: "{{ authelia_config_dir }}/configuration.yml"
        owner: root
        group: root
        mode: '0600'

    - name: Install Authelia users database
      ansible.builtin.template:
        src: templates/authelia/users.yml.j2
        dest: "{{ authelia_config_dir }}/users.yml"
        owner: root
        group: root
        mode: '0600'

    - name: Start Authelia compose stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ authelia_dir }}"
      register: authelia_compose_up
      changed_when: >-
        'Pulling' in authelia_compose_up.stdout or
        'Creating' in authelia_compose_up.stdout or
        'Created' in authelia_compose_up.stdout or
        'Starting' in authelia_compose_up.stdout or
        'Started' in authelia_compose_up.stdout or
        'Recreating' in authelia_compose_up.stdout or
        'Recreated' in authelia_compose_up.stdout

    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: present

    - name: Install Caddyfile
      ansible.builtin.template:
        src: templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: '0644'
      notify: Restart caddy

    - name: Ensure Caddy service is enabled
      ansible.builtin.service:
        name: caddy
        enabled: true
        state: started

    - name: Flush service handlers
      ansible.builtin.meta: flush_handlers

    - name: Wait for OpenCode localhost port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 4096
        timeout: 60

    - name: Wait for Authelia localhost port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9091
        timeout: 60

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify Caddy and OpenCode services are running
      ansible.builtin.assert:
        that:
          - ansible_facts.services.get('caddy.service', {}).state | default('') == 'running'
          - ansible_facts.services.get('opencode.service', {}).state | default('') == 'running'
        fail_msg: Caddy and OpenCode must both be running after deployment.

    - name: Verify public Authelia endpoint responds
      ansible.builtin.uri:
        url: "{{ authelia_url }}/"
        follow_redirects: none
        status_code:
          - 200
          - 302
      register: authelia_https_check
      retries: 10
      delay: 6
      until: authelia_https_check.status in [200, 302]

    - name: Verify public OpenCode endpoint requires Authelia session
      ansible.builtin.uri:
        url: "{{ opencode_url }}/"
        follow_redirects: none
        status_code:
          - 302
          - 303
          - 307
          - 308
      register: opencode_https_check
      retries: 10
      delay: 6
      until: >-
        (opencode_https_check.status | int) in [302, 303, 307, 308] and
        authelia_domain in (opencode_https_check.location | default(''))

    - name: Check OpenCode listen socket
      ansible.builtin.command:
        cmd: "ss -ltn '( sport = :4096 )'"
      register: opencode_socket_check
      changed_when: false

    - name: Verify OpenCode listens only on localhost
      ansible.builtin.assert:
        that:
          - opencode_socket_check.stdout is search('127\\.0\\.0\\.1:4096')
          - opencode_socket_check.stdout is not search('0\\.0\\.0\\.0:4096')
          - opencode_socket_check.stdout is not search('\\[::\\]:4096')
        fail_msg: OpenCode must listen only on 127.0.0.1:4096.
