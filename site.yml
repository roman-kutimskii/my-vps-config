---
- name: Configure VPS base services
  hosts: all
  gather_facts: true
  remote_user: dev
  become: true
  vars:
    ansible_become_password: "{{ vault_dev_password }}"

  handlers:
    - name: Restart opencode
      ansible.builtin.service:
        name: opencode
        state: restarted

    - name: Restart caddy
      ansible.builtin.service:
        name: caddy
        state: restarted

  pre_tasks:
    - name: Validate target OS
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version == '24.04'
        fail_msg: This project supports only Ubuntu 24.04 LTS.

    - name: Validate required site variables
      ansible.builtin.assert:
        that:
          - server_timezone | length > 0
          - swapfile_path | length > 0
          - (swapfile_size_mb | int) > 0
          - opencode_domain | length > 0
          - vault_dev_password != 'REPLACE_ME'
          - vault_opencode_server_password != 'REPLACE_ME'
        fail_msg: Fill required site variables and secrets before running site.yml.

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true

    - name: Set timezone symlink
      ansible.builtin.file:
        src: "/usr/share/zoneinfo/{{ server_timezone }}"
        dest: /etc/localtime
        state: link
        force: true

    - name: Write timezone file
      ansible.builtin.copy:
        dest: /etc/timezone
        content: "{{ server_timezone }}\n"
        owner: root
        group: root
        mode: '0644'

    - name: Check swapfile state
      ansible.builtin.stat:
        path: "{{ swapfile_path }}"
      register: swapfile_stat

    - name: Allocate swapfile
      ansible.builtin.command:
        cmd: "fallocate -l {{ swapfile_size_mb }}M {{ swapfile_path }}"
      when: not swapfile_stat.stat.exists

    - name: Set swapfile permissions
      ansible.builtin.file:
        path: "{{ swapfile_path }}"
        owner: root
        group: root
        mode: '0600'

    - name: Initialize swapfile
      ansible.builtin.command:
        cmd: "mkswap {{ swapfile_path }}"
      when: not swapfile_stat.stat.exists

    - name: Persist swapfile mount
      ansible.posix.mount:
        path: none
        src: "{{ swapfile_path }}"
        fstype: swap
        opts: sw
        state: present

    - name: Enable swapfile
      ansible.builtin.command:
        cmd: "swapon {{ swapfile_path }}"
      when: (ansible_swaptotal_mb | int) < (swapfile_size_mb | int)

    - name: Set UFW default incoming policy
      ansible.builtin.command:
        cmd: ufw default deny incoming
      register: ufw_incoming
      changed_when: "'Default incoming policy changed' in ufw_incoming.stdout"

    - name: Set UFW default outgoing policy
      ansible.builtin.command:
        cmd: ufw default allow outgoing
      register: ufw_outgoing
      changed_when: "'Default outgoing policy changed' in ufw_outgoing.stdout"

    - name: Allow SSH through UFW
      ansible.builtin.command:
        cmd: ufw allow 22/tcp
      register: ufw_ssh
      changed_when: "'Rule added' in ufw_ssh.stdout or 'updated' in ufw_ssh.stdout"

    - name: Allow HTTP through UFW
      ansible.builtin.command:
        cmd: ufw allow 80/tcp
      register: ufw_http
      changed_when: "'Rule added' in ufw_http.stdout or 'updated' in ufw_http.stdout"

    - name: Allow HTTPS through UFW
      ansible.builtin.command:
        cmd: ufw allow 443/tcp
      register: ufw_https
      changed_when: "'Rule added' in ufw_https.stdout or 'updated' in ufw_https.stdout"

    - name: Enable UFW
      ansible.builtin.command:
        cmd: ufw --force enable
      register: ufw_enable
      changed_when: "'Firewall is active' not in ufw_enable.stdout"

    - name: Create Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install Docker repository key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: '0644'

    - name: Configure Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Add dev user to docker group
      ansible.builtin.user:
        name: dev
        groups: docker
        append: true

    - name: Install OpenCode for dev user
      ansible.builtin.shell: >-
        curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
      args:
        creates: /home/dev/.opencode/bin/opencode
      become_user: dev

    - name: Install OpenCode systemd unit
      ansible.builtin.template:
        src: templates/opencode.service.j2
        dest: /etc/systemd/system/opencode.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart opencode

    - name: Install OpenCode environment file
      ansible.builtin.template:
        src: templates/opencode.env.j2
        dest: /etc/opencode.env
        owner: root
        group: root
        mode: '0600'
      notify: Restart opencode

    - name: Reload systemd manager
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure OpenCode service is enabled
      ansible.builtin.service:
        name: opencode
        enabled: true
        state: started

    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: present

    - name: Install Caddyfile
      ansible.builtin.template:
        src: templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: '0644'
      notify: Restart caddy

    - name: Ensure Caddy service is enabled
      ansible.builtin.service:
        name: caddy
        enabled: true
        state: started

    - name: Flush service handlers
      ansible.builtin.meta: flush_handlers

    - name: Verify OpenCode requires password locally
      ansible.builtin.uri:
        url: http://127.0.0.1:4096/
        status_code:
          - 401
      register: opencode_local_check
      retries: 10
      delay: 3
      until: opencode_local_check.status == 401

    - name: Verify public HTTPS endpoint responds
      ansible.builtin.uri:
        url: "https://{{ opencode_domain }}/"
        status_code:
          - 401
      register: opencode_https_check
      retries: 10
      delay: 6
      until: opencode_https_check.status == 401
